name: Build Probe

on:
  workflow_dispatch:
    inputs:
      keep_going:
        description: 'Use make -k to collect every compile error in one run'
        required: false
        default: 'yes'
        type: choice
        options:
          - 'yes'
          - 'no'

jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - name: Free Disk Space
        uses: insightsengineering/disk-space-reclaimer@v1
        with:
          tools-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true
          docker-images: true

      - uses: actions/checkout@v4

      - name: Install ubuntu environment
        shell: bash
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y git wget rpm rpm2cpio cpio make build-essential binutils m4 libtool-bin libncurses5 python3

      - name: Cache deps
        id: cache-deps
        uses: actions/cache@v3
        env:
          cache-name: cache-deps
        with:
          key: ${{ runner.os }}-build-${{ env.cache-name }}-el9.x86_64-${{ hashFiles('deps/init/oceanbase.el9.x86_64.deps') }}
          path: deps/3rd

      - name: Initialize release build
        shell: bash
        run: |
          set +e
          if [[ -f ~/.bashrc ]]; then
            source ~/.bashrc
          fi
          ./build.sh release --init > /tmp/init.log 2>&1
          echo "$?" > /tmp/init_exit
          tail -n 60 /tmp/init.log
          echo "=== configure exit $(cat /tmp/init_exit) ==="

      - name: Grammar check (bison -Werror)
        shell: bash
        run: |
          set +e
          DEVTOOLS=$PWD/deps/3rd/usr/local/oceanbase/devtools
          export PATH=$DEVTOOLS/bin:$PATH
          export BISON_PKGDATADIR=$DEVTOOLS/share/bison
          cd src/sql/parser
          bison -V | head -1 > /tmp/bison.log 2>&1
          bison -v -Werror -d sql_parser_mysql_mode.y -o /tmp/probe_tab.c >> /tmp/bison.log 2>&1
          echo "$?" > /tmp/bison_exit
          echo "bison exit $(cat /tmp/bison_exit)"
          grep -i conflict /tmp/bison.log || echo "no 'conflict' in bison output"
          if [[ -f _gen_parser.error ]]; then echo "=== _gen_parser.error ==="; cat _gen_parser.error; fi
          if [[ -f _gen_parser.output ]]; then echo "=== _gen_parser.output ==="; tail -n 40 _gen_parser.output; fi

      - name: Build release Unity binary
        shell: bash
        run: |
          set +e
          if [[ -f ~/.bashrc ]]; then
            source ~/.bashrc
          fi
          KG="-k"
          if [[ "${{ inputs.keep_going }}" == "no" ]]; then KG=""; fi
          cd build_release
          make -j4 $KG > /tmp/build.log 2>&1
          echo "$?" > /tmp/make_exit
          echo "make exit $(cat /tmp/make_exit)"
          tail -n 60 /tmp/build.log

      - name: Write report
        shell: bash
        if: always()
        run: |
          set +e
          {
            echo "## Bison exit: $(cat /tmp/bison_exit 2>/dev/null || echo 'not reached')"
            cat /tmp/bison.log 2>/dev/null | tail -n 30
            echo
            echo "## Configure exit: $(cat /tmp/init_exit 2>/dev/null || echo 'not reached')"
            echo "## Make exit: $(cat /tmp/make_exit 2>/dev/null || echo 'not reached')"
            echo
            echo "## First error lines"
            grep -n -E "error:|fatal error|undefined reference" /tmp/build.log 2>/dev/null | head -n 80
            echo
            echo "## Failing targets"
            grep -n -E "\*\*\* \[" /tmp/build.log 2>/dev/null | head -n 40
            echo
            echo "## Configure log tail"
            tail -n 50 /tmp/init.log 2>/dev/null
          } >> "$GITHUB_STEP_SUMMARY"
          mkdir -p /tmp/out && cp /tmp/build.log /tmp/init.log /tmp/bison.log /tmp/out/ 2>/dev/null; true

      - name: Upload logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-probe-logs
          path: /tmp/out
          if-no-files-found: ignore
