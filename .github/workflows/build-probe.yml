name: Build Probe

on:
  push:
    branches: [ci/task3-probe]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - name: Free Disk Space
        uses: insightsengineering/disk-space-reclaimer@v1
        with:
          tools-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true
          docker-images: true

      - uses: actions/checkout@v4

      - name: Install ubuntu environment
        shell: bash
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y git wget rpm rpm2cpio cpio make build-essential binutils m4 libtool-bin libncurses5 python3 ccache

      - name: Cache deps
        id: cache-deps
        uses: actions/cache@v3
        env:
          cache-name: cache-deps
        with:
          key: ${{ runner.os }}-build-${{ env.cache-name }}-el9.x86_64-${{ hashFiles('deps/init/oceanbase.el9.x86_64.deps') }}
          path: deps/3rd

      - name: Cache ccache
        uses: actions/cache@v3
        with:
          key: ccache-${{ github.run_id }}
          restore-keys: |
            ccache-
          path: ~/.cache/ccache

      - name: Initialize release build
        shell: bash
        run: |
          set +e
          mkdir -p "$HOME/ccache-bin"
          for c in gcc g++ cc c++; do ln -sf "$(command -v ccache)" "$HOME/ccache-bin/$c"; done
          export PATH="$HOME/ccache-bin:$PATH"
          export CCACHE_SLOPPINESS=time_macros
          if [[ -f ~/.bashrc ]]; then source ~/.bashrc; fi
          ./build.sh release --init > /tmp/init1.log 2>&1
          echo "$?" > /tmp/init_exit
          tail -n 30 /tmp/init1.log

      - name: Bison grammar check
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/out
          DEVTOOLS=$PWD/deps/3rd/usr/local/oceanbase/devtools
          export PATH=$DEVTOOLS/bin:$PATH
          export BISON_PKGDATADIR=$DEVTOOLS/share/bison
          cd src/sql/parser
          bison -V | head -1 | tee /tmp/out/bison_version.txt
          bison -v -Werror -d sql_parser_mysql_mode.y -o /tmp/probe_tab.c > /tmp/out/bison_werror.txt 2>&1
          echo "exit=$?" >> /tmp/out/bison_werror.txt
          cp /tmp/out/bison_werror.txt /tmp/bison.log
          bison -v -d sql_parser_mysql_mode.y -o /tmp/probe_tab2.c > /tmp/out/bison_plain.txt 2>&1
          echo "exit=$?" >> /tmp/out/bison_plain.txt
          REPORT=$(ls -1 *.output sql_parser_mysql_mode.output /tmp/*.output 2>/dev/null | head -1)
          if [[ -n "$REPORT" ]]; then
            grep -n -i "conflict" "$REPORT" | head -20 > /tmp/out/bison_report_conflicts.txt
            grep -n -A6 "Nonterminals useless" "$REPORT" | head -30 > /tmp/out/bison_report_useless.txt
            grep -n -A6 "Rules useless" "$REPORT" | head -40 > /tmp/out/bison_report_rules.txt
          fi
          echo "--- bison -Werror output ---"
          cat /tmp/out/bison_werror.txt

      - name: Compile with grammar warnings ignored
        shell: bash
        run: |
          set +e
          mkdir -p "$HOME/ccache-bin"
          for c in gcc g++ cc c++; do ln -sf "$(command -v ccache)" "$HOME/ccache-bin/$c"; done
          export PATH="$HOME/ccache-bin:$PATH"
          export CCACHE_SLOPPINESS=time_macros
          if [[ -f ~/.bashrc ]]; then source ~/.bashrc; fi
          sed -i 's/-Werror//' src/sql/parser/gen_parser.sh
          sed -i 's/\*"conflict"\*/"__NEVER__"/' src/sql/parser/gen_parser.sh
          grep -n "BISON_OUTPUT=\|conflict" src/sql/parser/gen_parser.sh
          ./build.sh release --init > /tmp/init2.log 2>&1
          echo "$?" > /tmp/init_exit2
          tail -n 30 /tmp/init2.log
          cd build_release
          timeout -k 60 3000 make -j4 -k > /tmp/build.log 2>&1
          echo "$?" > /tmp/make_exit
          echo "make exit $(cat /tmp/make_exit)"
          echo "error lines: $(grep -c 'error:' /tmp/build.log)"
          ccache -s | head -10
          true

      - name: Run ai_function + file_sql + ai_column suites (strict result comparison)
        shell: bash
        if: always()
        run: |
          set +e
          BINARY=build_release/src/observer/seekdb
          if [[ ! -x "$BINARY" ]]; then
            echo "observer binary missing, skip mysqltest"
            exit 0
          fi
          echo "--- restrict to the three competition suites, strict result comparison (judge-equivalent) ---"
          find tools/deploy/mysql_test -name '*.test' -not -path '*/ai_column/*' -not -path '*/ai_function/*' -not -path '*/file_sql/*' -delete
          find tools/deploy/mysql_test -name '*.result' -not -path '*/ai_column/*' -not -path '*/ai_function/*' -not -path '*/file_sql/*' -delete
          python3 - <<'PY'
          import re
          p = "tools/deploy/mysqltest_config.yaml"
          s = open(p, encoding="utf-8").read()
          s = "\n".join(l for l in s.splitlines() if not re.match(r'^      - \S', l))
          open(p, "w", encoding="utf-8").write(s + "\n")
          PY
          export SEEKDB_STRICT_RESULT=1
          head -20 tools/deploy/mysqltest_config.yaml
          echo "remaining .test files: $(find tools/deploy/mysql_test -name '*.test' | wc -l)"
          RUNTIME_DIR=/tmp/seekdb_runtime
          TASK_DIR=/tmp/mt_task
          rm -rf "$RUNTIME_DIR" "$TASK_DIR"
          mkdir -p "$RUNTIME_DIR/obclient" "$TASK_DIR"
          cp -L -f "$BINARY" "$RUNTIME_DIR/seekdb"
          cp -a deps/3rd/u01/obclient/. "$RUNTIME_DIR/obclient/"
          export GITHUB_WORKSPACE="$PWD"
          export SEEKDB_TASK_DIR="$TASK_DIR"
          export SEEKDB_RUNTIME_DIR="$RUNTIME_DIR"
          export SEEKDB_BINARY="$RUNTIME_DIR/seekdb"
          export SLICE_IDX=0 SLICES=1
          chmod +x .github/script/seekdb/mysqltest_slice.sh
          timeout -k 60 3600 .github/script/seekdb/mysqltest_slice.sh > /tmp/mt_run.log 2>&1
          echo "runner exit $?"
          tail -n 60 /tmp/mt_run.log
          mkdir -p /tmp/out
          cp /tmp/mt_run.log /tmp/out/ 2>/dev/null

      - name: Write mysqltest report
        shell: bash
        if: always()
        run: |
          set +e
          TASK_DIR=/tmp/mt_task
          {
            echo "## mysqltest seekdb_result.json"
            echo '```'
            head -c 6000 "$TASK_DIR/seekdb_result.json" 2>/dev/null
            echo '```'
            echo "## ai_column case sequence (from runner log)"
            echo '```'
            grep -n -E "\[ *(RUN|OK|FAILED|RETRY) *\]" /tmp/mt_run.log 2>/dev/null | head -80
            echo '```'
            echo "## failure logs and rejects"
            FOUND=$(find "$TASK_DIR" \( -name '*.reject' -o -name 'mysqltest.log' \) 2>/dev/null)
            if [[ -z "$FOUND" ]]; then
              echo "(none)"
            else
              while IFS= read -r f; do
                echo "### $f"
                echo '```'
                tail -c 8000 "$f"
                echo '```'
              done <<< "$FOUND"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          mkdir -p /tmp/out/observer_log
          for d in "$TASK_DIR"/failures/*/instance/seekdb_log "$TASK_DIR"/failures/instance/seekdb_log; do
            [[ -d "$d" ]] || continue
            case_tag=$(basename "$(dirname "$(dirname "$d")")")
            {
              echo "## observer log evidence: $case_tag"
              echo '```'
              grep -h -E "ret=-4014|CRASH|SIGSEGV|SIGABRT|coredump|failed to retry ai column|failed to get table schema|OB_INNER_STAT_ERROR|ai_column" "$d"/*.log* 2>/dev/null | tail -40
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            for f in "$d"/*; do
              [[ -f "$f" ]] || continue
              tail -c 2000000 "$f" > "/tmp/out/observer_log/${case_tag}__$(basename "$f")" 2>/dev/null
            done
          done
          mkdir -p /tmp/out
          find "$TASK_DIR" \( -name '*.reject' -o -name 'mysqltest.log' \) -exec cp --parents {} /tmp/out/ \; 2>/dev/null
          mkdir -p /tmp/out/mysqltest_log
          cp "$TASK_DIR"/mysqltest_log/*.log /tmp/out/mysqltest_log/ 2>/dev/null
          cp "$TASK_DIR/seekdb_result.json" /tmp/out/ 2>/dev/null
          ls -la /tmp/out

      - name: Write report
        shell: bash
        if: always()
        run: |
          set +e
          mkdir -p /tmp/out
          {
            echo "## bison -Werror raw output"
            echo '```'
            head -c 4000 /tmp/out/bison_werror.txt
            echo '```'
            echo "## grammar report: conflicts / useless"
            echo '```'
            cat /tmp/out/bison_report_conflicts.txt /tmp/out/bison_report_useless.txt /tmp/out/bison_report_rules.txt 2>/dev/null
            echo '```'
            echo "## configure exit (1st=$(cat /tmp/init_exit 2>/dev/null), patched=$(cat /tmp/init_exit2 2>/dev/null)) make exit=$(cat /tmp/make_exit 2>/dev/null)"
            echo "## first compile errors"
            echo '```'
            grep -n -E "error:|fatal error|undefined reference to" /tmp/build.log 2>/dev/null | head -60
            echo '```'
            echo "## failing targets"
            echo '```'
            grep -n -E "\*\*\* \[" /tmp/build.log 2>/dev/null | head -25
            echo '```'
            echo "## patched configure tail"
            echo '```'
            tail -n 25 /tmp/init2.log 2>/dev/null
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cp /tmp/build.log /tmp/init1.log /tmp/init2.log /tmp/out/ 2>/dev/null
          ls -la /tmp/out

      - name: Upload logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-probe-logs
          path: /tmp/out
          if-no-files-found: ignore
